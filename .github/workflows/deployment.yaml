name: Frontend deployment
on:
  push:
    branches: [main]
    paths:
      - "**"
jobs:
  check-syntax:
      runs-on: ubuntu-latest
      steps:
         - name: checkout code
           uses: actions/checkout@v4
         - name: setup node
           uses: actions/setup-node@v4
           with:
             node-version: '22'
             cache: 'npm'
             cache-dependency-path: package-lock.json      
        
         - name: Run ESLint 
           run: npm run lint -- --deny-warnings
         
         - name: Check Prettier formatting
           run: npx prettier --check "app/**/*.{ts,jsx}" "components/**/*.{ts,jsx}" "lib/**/*.{ts,jsx}"
         - name: TypeScript strict type check
           run: npx tsc --noEmit
      
